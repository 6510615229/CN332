<!-- templates/partials/notifications_bell.html -->
<div x-data="{ open: false }" class="relative inline-block">
    
    <div id="notification-bell" 
         @click="open = !open"
         class="relative cursor-pointer p-2 rounded-full hover:bg-gray-700 transition flex items-center justify-center"
         hx-get="{% url 'a_home:navbar-notifications' %}" 
         hx-trigger="every 30s" 
         hx-swap="outerHTML">
        
        <!-- 🔔 ไอคอนกระดิ่ง -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" class="w-7 h-7 shadow-sm">
            <path fill-rule="evenodd" d="M5.25 9a6.75 6.75 0 0 1 13.5 0v.75c0 2.123.8 4.057 2.118 5.52a.75.75 0 0 1-.297 1.206c-1.544.57-3.16.99-4.831 1.243a3.75 3.75 0 1 1-7.48 0 24.585 24.585 0 0 1-4.831-1.244.75.75 0 0 1-.298-1.205A8.217 8.217 0 0 0 5.25 9.75V9Zm4.502 8.9a2.25 2.25 0 1 0 4.496 0 25.057 25.057 0 0 1-4.496 0Z" clip-rule="evenodd" />
        </svg>

        <!-- ตัวเลขแจ้งเตือนสีแดง -->
        {% if count > 0 %}
        <span class="absolute top-1 right-1 flex h-5 w-5 items-center justify-center rounded-full bg-red-600 text-[10px] font-bold text-white border-2 border-gray-800 shadow-sm">
            {{ count }}
        </span>
        {% endif %}
    </div>

    <!-- Dropdown Menu -->
    <div x-show="open" 
         @click.away="open = false"
         x-cloak
         hx-get="{% url 'a_home:notification-list' %}"
         hx-trigger="intersect once"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="absolute right-0 mt-3 w-80 bg-white rounded-xl shadow-2xl border border-gray-100 z-50 text-black overflow-hidden">
         
         <div class="p-4 text-center">
             <div class="inline-block animate-spin rounded-full h-4 w-4 border-b-2 border-indigo-600"></div>
             <span class="ml-2 text-sm text-gray-500">กำลังโหลด...</span>
         </div>
    </div>
</div>
