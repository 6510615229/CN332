<!-- templates/resident/chatbot.html -->
{% extends 'role_layout.html' %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">ยินดีต้อนรับสู่ RuenPhiman</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
        <!-- Assistant Card -->
        <div class="bg-white rounded-2xl shadow-lg border border-indigo-100 p-8 flex flex-col items-center justify-center text-center transition-transform hover:scale-105 cursor-pointer"
             onclick="openChat()">
            <div class="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center mb-6">
                <svg class="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-3">AI Assistant</h2>
            <p class="text-gray-500 mb-6">พูดคุย สอบถามข้อมูล หรือแจ้งปัญหาผ่านแชต</p>
            <button class="bg-indigo-600 text-white font-semibold py-3 px-8 rounded-full hover:bg-indigo-700 transition-colors w-full">
                เริ่มคุยเลย
            </button>
        </div>

        <!-- 🆕 แก้ตรงนี้: ใช้ Hardcoded URL -->
        <a href="/resident/repair_form/" class="bg-white rounded-2xl shadow-lg border border-red-100 p-8 flex-1 flex flex-col items-center justify-center text-center transition-transform hover:scale-105 cursor-pointer">
            <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mb-6">
                <svg class="w-12 h-12 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-3">แจ้งซ่อม (Repair)</h2>
            <p class="text-gray-500 mb-6">กรอกฟอร์มแจ้งปัญหาการใช้งาน หรืออุปกรณ์ชำรุด</p>
            <div class="bg-red-500 text-white font-semibold py-3 px-8 rounded-full hover:bg-red-600 transition-colors w-full inline-block text-center">
                กรอกแบบฟอร์ม
            </div>
        </a>
    </div>
</div>

<script>
function openChat() {
    // ฟังก์ชันเปิดแชท
    alert('เปิดหน้าต่างแชท');
}
</script>
{% endblock %}
