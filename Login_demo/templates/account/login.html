{% extends "base.html" %}
{% load i18n %}
{% load account socialaccount %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-4">
        <h2 class="text-center mb-4">เข้าสู่ระบบ</h2>

        <!-- ปุ่ม Social Login -->
        <div class="d-grid gap-2 mb-3">
            <a href="{% provider_login_url 'google' %}" class="btn btn-danger">
                 Login with Google
            </a>
            <a href="{% provider_login_url 'line' %}" class="btn btn-success">
                 Login with LINE
            </a>
        </div>

        <div class="text-center text-muted my-3">- หรือ -</div>

        <!-- ฟอร์ม Login ปกติ -->
        <form class="login" method="POST" action="{% url 'account_login' %}">
            {% csrf_token %}
            
            {{ form.as_p }}

            {% if redirect_field_value %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
            {% endif %}
            
            <button class="btn btn-dark w-100 mt-3" type="submit">Login</button>
        </form>
        
        <div class="mt-3 text-center">
            <small>ยังไม่มีบัญชี? <a href="{{ signup_url }}">สมัครสมาชิก</a></small> <br>
            <small><a href="{% url 'account_reset_password' %}">ลืมรหัสผ่าน?</a></small>
        </div>
    </div>
</div>
{% endblock %}
