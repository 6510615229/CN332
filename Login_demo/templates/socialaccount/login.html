{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body text-center p-5">
        <h2 class="card-title mb-4">ยืนยันการเข้าสู่ระบบ</h2>
        
        <p class="card-text text-muted mb-4">
            คุณกำลังจะเข้าสู่ระบบผ่านบัญชี <strong>{{ provider.name }}</strong><br>
            โปรดกดปุ่มด้านล่างเพื่อดำเนินการต่อ
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary btn-lg w-100">
                ดำเนินการต่อ (Continue)
            </button>
        </form>
    </div>
</div>
{% endblock %}
